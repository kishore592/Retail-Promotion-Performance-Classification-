services:
  backend:
    build: ./docker/backend
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: sqlite+aiosqlite:///./retail.db
      CORS_ORIGINS: http://localhost:3000
    volumes: ["./backend:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: retail
      POSTGRES_PASSWORD: retail
      POSTGRES_DB: retail
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
